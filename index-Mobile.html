<script>

class Component extends DCLogic {
  goSlide(i) {
    this.setState({ slide: i, paused: false });
    this.sched(i);
  }
  sched(i, ms) {
    clearTimeout(this._tm);
    const d = ms == null ? (i === 0 ? 9000 : 5000) : ms;
    this._t0 = Date.now(); this._ms = d; this._cur = i;
    this._tm = setTimeout(() => this.goSlide(i === 0 ? 1 : 0), d);
  }
  togglePause() {
    if ((this.state || {}).paused) {
      this.setState({ paused: false });
      this.sched(this._cur || 0, Math.max(300, this._left || 0));
    } else {
      clearTimeout(this._tm);
      this._left = this._ms - (Date.now() - this._t0);
      this.setState({ paused: true });
    }
  }
  componentDidMount() { this.sched(0); }
  componentWillUnmount() { clearTimeout(this._tm); }
  renderVals() {
    return {
      reload: () => { this.goSlide(0); const k = Object.keys(this.state || {}); this.setState(k.reduce((o, key) => { o[key] = undefined; return o; }, {})); window.scrollTo(0, 0); },
      accent: this.props.accent ?? '#068A4C',
      slide1: ((this.state || {}).slide || 0) === 0 ? 'flex' : 'none',
      s2: ((this.state || {}).slide || 0) === 1 ? 'flex' : 'none',
      prevSlide: () => this.goSlide(((this.state || {}).slide || 0) === 0 ? 1 : 0),
      nextSlide: () => this.goSlide(((this.state || {}).slide || 0) === 0 ? 1 : 0),
      goFirst: () => this.goSlide(0),
      goSecond: () => this.goSlide(1),
      togglePause: () => this.togglePause(),
      ps: (this.state || {}).paused ? 'paused' : 'running',
      pauseIcon: (this.state || {}).paused ? 'none' : 'block',
      playIcon: (this.state || {}).paused ? 'block' : 'none',
      pauseLabel: (this.state || {}).paused ? '배너 재생' : '배너 일시정지',
      a1: ((this.state || {}).slide || 0) === 0 ? 'bannerFill 9s linear forwards' : 'none',
      a2: ((this.state || {}).slide || 0) === 1 ? 'bannerFill 5s linear forwards' : 'none',
      direct: [
        { name: '올픽', benefit: '추가 현금 5만원', line: '1px solid #DDE1DE' },

        { cat: '인터넷', benefit: '인터넷 가입 상담 접수', name: '올라프', url: 'https://www.ollaf.co.kr/landing', img: 'assets/7c9f490546c4.jpg' },
        { cat: '자동차 렌트/리스', benefit: '신차장기렌트의 모든 것', name: '중카TV', url: 'https://replyalba.com/pt/ASWDVqmoWW', img: 'assets/b1a048902555.jpg' },

      ].map(p => ({ ...p, bg: "url('" + p.img + "') center / cover no-repeat" }))
    };
  }
}

</script>
