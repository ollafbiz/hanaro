  <main id="top" style="padding: 0 0 80px; display: flex; flex-direction: column; align-items: center"><div style="width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 28px; padding: 24px 20px 0; box-sizing: border-box"><h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em">개인정보처리방침</h1><p style="margin: 0; font-size: 14px; line-height: 1.8; color: #3A4454">케이엘커넥트(이하 "회사")가 운영하는 하나로(이하 "서비스")는 이용자의 개인정보를 소중히 다루며, 「개인정보 보호법」 등 관련 법령을 준수합니다. 본 방침을 통해 이용자의 개인정보가 어떤 목적으로 어떻게 처리되는지 안내드립니다.</p><section style="display: flex; flex-direction: column; gap: 10px"><h2 style="margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: #1E2420">1. 수집하는 개인정보 항목</h2><p style="margin: 0; font-size: 14px; line-height: 1.8; color: #3A4454">회사는 서비스 제공을 위해 아래와 같이 필요한 최소한의 개인정보를 수집합니다.</p><ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.8; color: #3A4454"><li><b>견적 요청</b>: 연락처(필수), 이름·상담내용(선택)</li><li><b>계약 인증글 등록</b>: 성명, 연락처, 가입(이용)일, 이용업체명(필수), 내용·첨부 사진(선택)</li><li><b>제휴 문의(이메일)</b>: 업체명, 담당자명·직책, 연락처, 이메일 주소 등 문의 시 직접 기재한 정보</li></ul></section><section style="display: flex; flex-direction: column; gap: 10px"><h2 style="margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: #1E2420">2. 개인정보의 수집·이용 목적</h2><ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.8; color: #3A4454"><li><b>견적 요청</b>: 상담 연락 및 안내, 요청하신 이용업체 연결</li><li><b>계약 인증글</b>: 가입(이용) 사실 확인, 사은품 지급 및 지급 관련 안내, 인증글의 서비스 내 이용</li><li><b>제휴 문의</b>: 문의 내용 확인 및 회신</li></ul></section><section style="display: flex; flex-direction: column; gap: 10px"><h2 style="margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: #1E2420">3. 개인정보의 보유 및 이용 기간</h2><p style="margin: 0; font-size: 14px; line-height: 1.8; color: #3A4454">개인정보는 수집·이용 목적이 달성되면 지체 없이 파기합니다. 다만 아래 기간 동안은 보관 후 파기하며, 관계 법령에 따라 보존이 필요한 경우에는 해당 기간 동안 보관합니다.</p><ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.8; color: #3A4454"><li>견적 요청: 상담 종료 후 6개월</li><li>계약 인증글: 사은품 지급 완료일로부터 1년</li><li>제휴 문의: 문의 처리 완료 후 1년</li></ul></section><section style="display: flex; flex-direction: column; gap: 10px"><h2 style="margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: #1E2420">4. 개인정보의 제3자 제공</h2><p style="margin: 0; font-size: 14px; line-height: 1.8; color: #3A4454">회사는 이용자의 개인정보를 원칙적으로 외부에 제공하지 않으며, 아래의 경우에 한해 이용자의 동의를 받고 제공합니다.</p><ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.8; color: #3A4454"><li><b>견적 요청</b>: 제공받는 자는 이용자가 요청한 이용업체이며, 제공 항목은 이름·연락처·상담내용, 목적은 상담 연결입니다.</li><li><b>계약 인증</b>: 제공받는 자는 이용하신 업체이며, 제공 항목은 성명·연락처·가입(이용)일, 목적은 실제 가입(이용) 여부 확인입니다.</li><li>제공받는 자의 보유·이용 기간은 제공 목적이 달성될 때까지입니다.</li><li>동의를 거부할 권리가 있으며, 거부 시 견적 요청, 인증글 등록 및 사은품 지급이 제한될 수 있습니다.</li></ul></section><section style="display: flex; flex-direction: column; gap: 10px"><h2 style="margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: #1E2420">5. 개인정보 처리의 위탁</h2><p style="margin: 0; font-size: 14px; line-height: 1.8; color: #3A4454">현재 회사는 개인정보 처리를 외부에 위탁하고 있지 않습니다. 위탁이 필요한 경우 수탁자와 위탁 업무 내용을 본 방침에 공개하고 관계 법령에 따라 관리·감독합니다.</p></section><section style="display: flex; flex-direction: column; gap: 10px"><h2 style="margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: #1E2420">6. 개인정보의 파기 절차 및 방법</h2><ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.8; color: #3A4454"><li>파기 사유가 발생한 개인정보는 지체 없이 파기합니다.</li><li>전자적 파일은 복구할 수 없는 방법으로 삭제하고, 출력물은 분쇄하거나 소각합니다.</li></ul></section><section style="display: flex; flex-direction: column; gap: 10px"><h2 style="margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: #1E2420">7. 이용자의 권리와 행사 방법</h2><p style="margin: 0; font-size: 14px; line-height: 1.8; color: #3A4454">이용자는 언제든지 자신의 개인정보에 대한 열람, 정정, 삭제, 처리정지를 요구하거나 동의를 철회할 수 있습니다. 아래 개인정보 보호책임자의 이메일로 요청하시면 지체 없이 조치합니다. 작성하신 인증글의 이용에 대한 철회도 같은 방법으로 요청하실 수 있습니다.</p></section><section style="display: flex; flex-direction: column; gap: 10px"><h2 style="margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: #1E2420">8. 개인정보의 안전성 확보 조치</h2><p style="margin: 0; font-size: 14px; line-height: 1.8; color: #3A4454">회사는 개인정보를 안전하게 관리하기 위해 개인정보를 취급하는 사람을 최소한으로 제한하고, 접근 권한 관리 등 필요한 관리적·기술적 조치를 하고 있습니다.</p></section><section style="display: flex; flex-direction: column; gap: 10px"><h2 style="margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: #1E2420">9. 쿠키 등 자동 수집 장치</h2><p style="margin: 0; font-size: 14px; line-height: 1.8; color: #3A4454">서비스는 맞춤형 광고 등을 위한 쿠키를 사용하지 않습니다. 향후 사용하게 되는 경우 본 방침을 통해 사전에 안내합니다.</p></section><section style="display: flex; flex-direction: column; gap: 10px"><h2 style="margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: #1E2420">10. 아동의 개인정보</h2><p style="margin: 0; font-size: 14px; line-height: 1.8; color: #3A4454">회사는 만 14세 미만 아동의 개인정보를 수집하지 않으며, 만 14세 미만 이용자는 서비스의 견적 요청 및 인증글 등록을 이용할 수 없습니다.</p></section><section style="display: flex; flex-direction: column; gap: 10px"><h2 style="margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: #1E2420">11. 개인정보 보호책임자</h2><ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.8; color: #3A4454"><li>성명: 구자경</li><li>이메일: klconactkr@gmail.com</li><li>운영: 케이엘커넥트 (사업자등록번호 305-66-00691) · 경기도 오산시 대원로 11, 4층 2호</li></ul><p style="margin: 0; font-size: 14px; line-height: 1.8; color: #3A4454">개인정보와 관련한 문의, 불만 처리, 피해 구제는 위 연락처로 요청하실 수 있습니다.</p></section><section style="display: flex; flex-direction: column; gap: 10px"><h2 style="margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: #1E2420">12. 권익침해 구제 방법</h2><p style="margin: 0; font-size: 14px; line-height: 1.8; color: #3A4454">개인정보 침해에 대한 신고나 상담이 필요하신 경우 아래 기관에 문의하실 수 있습니다.</p><ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.8; color: #3A4454"><li>개인정보분쟁조정위원회: 1833-6972 (kopico.go.kr)</li><li>개인정보침해 신고센터(한국인터넷진흥원): 국번 없이 118 (privacy.kisa.or.kr)</li><li>대검찰청 사이버수사과: 국번 없이 1301 (spo.go.kr)</li><li>경찰청 사이버수사국: 국번 없이 182 (ecrm.police.go.kr)</li></ul></section><section style="display: flex; flex-direction: column; gap: 10px"><h2 style="margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: #1E2420">13. 방침의 변경</h2><p style="margin: 0; font-size: 14px; line-height: 1.8; color: #3A4454">본 방침은 2026년 11월 11일부터 적용됩니다. 내용이 추가·삭제·수정되는 경우 변경 사항을 시행 최소 7일 전에 서비스 화면을 통해 알려드립니다.</p></section></div></main>
