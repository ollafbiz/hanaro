<script src="dc-runtime.js"></script>
<script>

class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const carrier = s.carrier ?? 'KT';
    const speed = s.speed ?? '1G';
    const tv = s.tv ?? 'TV 포함';
    const openCard = s.openCard ?? 0;
    const chip = (key, val, cur) => ({
      label: val,
      on: String(val === cur),
      bg: val === cur ? 'var(--accent)' : '#FFFFFF',
      fg: val === cur ? '#FFFFFF' : '#3A4440',
      bd: val === cur ? 'var(--accent)' : '#B9C1BC',
      pick: () => this.setState({ [key]: val })
    });
    const line = '1px solid #E0E3E1';
    const lead = { headBg: 'var(--accent)', headFg: '#FFFFFF', giftFg: '#FFFFFF', giftSize: '40px', badgeBg: '#FFFFFF', badgeFg: 'var(--accent)', shadow: '0 10px 24px rgba(20, 50, 35, 0.24)' };
    const rest = { headBg: 'color-mix(in srgb, var(--accent) 8%, white)', headFg: '#1E2420', giftFg: 'var(--accent)', giftSize: '30px', badgeBg: 'var(--accent)', badgeFg: '#FFFFFF', shadow: '0 4px 12px rgba(20, 50, 35, 0.10)' };
    return {
      reload: () => { const k = Object.keys(this.state || {}); this.setState(k.reduce((o, key) => { o[key] = undefined; return o; }, {})); window.scrollTo(0, 0); },
      accent: this.props.accent ?? '#068A4C',
      carriers: ['SK', 'KT', 'LG'].map((v) => chip('carrier', v, carrier)),
      speeds: ['500M', '1G'].map((v) => chip('speed', v, speed)),
      tvs: ['TV 포함', 'TV 미포함'].map((v) => chip('tv', v, tv)),
      summary: carrier + ' · ' + speed + ' · ' + tv,
      sites: [
