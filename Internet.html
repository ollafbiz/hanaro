<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>인터넷 비교 견적 | 하나로</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<script>(function(){var small=matchMedia('(max-width:767px)').matches;if(small!==false){location.replace('Internet-Mobile.html'+location.search+location.hash)}})();</script>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
a:hover{opacity:.85}
button:hover{opacity:.9}
</style>

</head>
<body>
<div id="app" data-props='{"accent":{"editor":"color","default":"#068A4C","options":["#068A4C","#0B6BCB","#2348C7","#0F4FA8"]},"$preview":{"width":1440,"height":2790}}'></div>
<template id="dc-tpl">

<div style="--accent: {{accent}}; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #1E2420; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; word-break: keep-all">
  <button type="button" onClick="{{reload}}" data-review-toggle="true" aria-label="새로고침" style="position: fixed; left: 18px; bottom: 18px; z-index: 20; height: 44px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 6px; background: #1E2420; color: #FFFFFF; border: 0; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.300 5.700"></path><path d="M20 4v7h-7"></path></svg>새로고침</button>

  <a href="Internet-Mobile.html" data-review-toggle="true" style="position: fixed; top: 18px; right: 18px; z-index: 20; height: 44px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; background: #1E2420; color: #FFFFFF; border-radius: 999px; font-size: 14px; font-weight: 600; text-decoration: none">모바일로 보기</a>
  <header style="padding: 0 max(20px, calc((100vw - 1100px) / 2)); border-bottom: 1px solid #E3E6EB">
    <div style="height: 84px; display: flex; align-items: center; gap: 40px">
      <a href="index.html" style="font-size: 24px; font-weight: 700; color: var(--accent); text-decoration: none; display: flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="4.500" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h12c6 0 8 4 8 6v12c0 2 2 4 6 4h6"></path><path d="M4 32h12" stroke-opacity=".4"></path></svg>하나로</a>
      <form role="search" style="flex: 1; max-width: 720px; height: 52px; box-sizing: border-box; display: flex; border: 2px solid var(--accent); border-radius: 999px; overflow: hidden">
        <input type="search" aria-label="혜택과 업체 검색" placeholder="필요하신 서비스, 업종 등을 검색해보세요" style="flex: 1; min-width: 0; padding: 0 22px; border: 0; outline-offset: -2px; font: inherit; font-size: 16px; color: #1E2420; background: #FFFFFF">
        <button type="button" aria-label="검색" style="width: 56px; display: flex; align-items: center; justify-content: center; background: var(--accent); color: #FFFFFF; border: 0; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M16.500 16.500L21 21"></path></svg></button>
      </form>
    </div>
    <nav aria-label="카테고리" style="margin-left: -16px; display: flex; gap: 4px">
      <a href="index.html" style="padding: 12px 16px; font-size: 16px; font-weight: 500; text-decoration: none">전체서비스</a>
      <a href="Internet.html" aria-current="page" style="padding: 12px 16px; font-size: 16px; font-weight: 700; color: var(--accent); text-decoration: none">인터넷·TV</a>
      <a href="Review.html" style="padding: 12px 16px; font-size: 16px; font-weight: 500; text-decoration: none">계약 인증</a>
      <a href="Partner.html" style="padding: 12px 16px; font-size: 16px; font-weight: 500; text-decoration: none">파트너 신청</a>
    </nav>
  </header>

  <main style="padding: 40px max(20px, calc((100vw - 1100px) / 2)) 80px; display: flex; flex-direction: column; gap: 48px">

    <section style="display: flex; flex-direction: column; gap: 20px">
      <h1 style="margin: 0; font-size: 36px; font-weight: 700; letter-spacing: -0.01em">인터넷 비교 견적</h1>
    <nav aria-label="업종" style="display: flex; flex-wrap: wrap; gap: 0 4px; border-bottom: 1px solid #E3E6EB">
      <a aria-current="page" href="Internet.html" style="padding: 14px 20px; border-bottom: 3px solid var(--accent); font-size: 16px; font-weight: 700; color: var(--accent); text-decoration: none">인터넷·TV</a>
      <a href="Beauty.html" style="padding: 14px 20px; border-bottom: 3px solid transparent; font-size: 16px; font-weight: 500; color: #3A4454; text-decoration: none">뷰티·건강</a>
      <a href="Moving.html" style="padding: 14px 20px; border-bottom: 3px solid transparent; font-size: 16px; font-weight: 500; color: #3A4454; text-decoration: none">이사</a>
      <a href="Cleaning.html" style="padding: 14px 20px; border-bottom: 3px solid transparent; font-size: 16px; font-weight: 500; color: #3A4454; text-decoration: none">청소</a>
      <a href="Plumbing.html" style="padding: 14px 20px; border-bottom: 3px solid transparent; font-size: 16px; font-weight: 500; color: #3A4454; text-decoration: none">설비·배관</a>
      <a href="Rent.html" style="padding: 14px 20px; border-bottom: 3px solid transparent; font-size: 16px; font-weight: 500; color: #3A4454; text-decoration: none">자동차 렌트/리스</a>
      <a href="Category.html" style="padding: 14px 20px; border-bottom: 3px solid transparent; font-size: 16px; font-weight: 500; color: #3A4454; text-decoration: none">웨딩</a>
      <a href="Interior.html" style="padding: 14px 20px; border-bottom: 3px solid transparent; font-size: 16px; font-weight: 500; color: #3A4454; text-decoration: none">인테리어·철거</a>
      <a href="Accounting.html" style="padding: 14px 20px; border-bottom: 3px solid transparent; font-size: 16px; font-weight: 500; color: #3A4454; text-decoration: none">회계·법무</a>
    </nav>
    </section>

    <section id="calc" style="display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start">
      <div style="flex: 1 1 560px; min-width: 0; padding: 28px; border: 1px solid #E3E6EB; border-radius: 16px; background: #FFFFFF; display: flex; flex-direction: column; gap: 28px">
        <div style="display: flex; gap: 16px">
          <span style="font-size: 15px; font-weight: 700; width: 84px; flex: none; padding-top: 12px">조건선택</span>
          <div style="flex: 1; min-width: 0"><div style="display: flex; gap: 8px; flex-wrap: wrap">
            <sc-for list="{{conds}}" as="c" hint-placeholder-count="2">
              <button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="min-height: 46px; padding: 0 18px; background: {{c.bg}}; color: {{c.fg}}; border: 1.5px solid {{c.bd}}; border-radius: 12px; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">{{c.label}}</button>
            </sc-for>
          </div></div>
        </div>
        <div style="display: flex; gap: 16px">
          <span style="font-size: 15px; font-weight: 700; width: 84px; flex: none; padding-top: 12px">통신사</span>
          <div style="flex: 1; min-width: 0"><div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
            <sc-for list="{{carriers}}" as="c" hint-placeholder-count="5">
              <button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="height: 84px; padding: 8px 4px; background: {{c.bg}}; border: 1.5px solid {{c.bd}}; border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 4px; font: inherit">
                <span style="flex: 1; display: flex; align-items: center; justify-content: center"><img src="{{c.img}}" alt="" style="height: {{c.imgH}}; max-width: 100%; object-fit: contain"></span>
                <span style="font-size: 12px; font-weight: 700; color: {{c.fg}}; white-space: nowrap; letter-spacing: -0.03em">{{c.label}}</span>
              </button>
            </sc-for>
          </div></div>
        </div>
        <div style="display: flex; gap: 16px">
          <span style="font-size: 15px; font-weight: 700; width: 84px; flex: none; padding-top: 12px">인터넷</span>
          <div style="flex: 1; min-width: 0"><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding-top: 6px">
            <sc-for list="{{netOpts}}" as="o" hint-placeholder-count="3">
              <button type="button" aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="position: relative; min-height: 44px; text-align: left; padding: 14px 14px 12px; background: {{o.bg}}; border: 1.5px solid {{o.bd}}; border-radius: 12px; font: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 3px">
                <span style="position: absolute; top: -9px; left: 10px; display: {{o.pickDisp}}; background: var(--accent); color: #FFFFFF; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 5px">하나로 PICK</span>
                <span style="font-size: 18px; font-weight: 700; color: #1E2420">{{o.title}}</span>
                <span style="font-size: 13px; line-height: 1.4; color: #56605A">{{o.desc}}</span>
                <span style="font-size: 12px; line-height: 1.4; color: #7A837D">{{o.note}}</span>
                <span style="margin-top: 6px; font-size: 15px; font-weight: 700; color: {{o.fg}}">{{o.priceText}}</span>
              </button>
            </sc-for>
          </div></div>
        </div>
        <sc-if value="{{showTv}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; gap: 16px">
          <span style="font-size: 15px; font-weight: 700; width: 84px; flex: none; padding-top: 12px">TV 상품</span>
          <div style="flex: 1; min-width: 0"><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding-top: 6px">
            <sc-for list="{{tvOpts}}" as="o" hint-placeholder-count="3">
              <button type="button" aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="position: relative; min-height: 44px; text-align: left; padding: 14px 14px 12px; background: {{o.bg}}; border: 1.5px solid {{o.bd}}; border-radius: 12px; font: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 3px">
                <span style="position: absolute; top: -9px; left: 10px; display: {{o.pickDisp}}; background: var(--accent); color: #FFFFFF; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 5px">하나로 PICK</span>
                <span style="font-size: 18px; font-weight: 700; color: #1E2420">{{o.title}}</span>
                <span style="font-size: 13px; line-height: 1.4; color: #56605A">{{o.desc}}</span>
                <span style="font-size: 12px; line-height: 1.4; color: #7A837D">{{o.note}}</span>
                <span style="margin-top: 6px; font-size: 15px; font-weight: 700; color: {{o.fg}}">{{o.priceText}}</span>
              </button>
            </sc-for>
          </div></div>
        </div>
        </sc-if>
        <div style="display: flex; gap: 16px">
          <span style="font-size: 15px; font-weight: 700; width: 84px; flex: none; padding-top: 12px">결합 할인</span>
          <div style="flex: 1; min-width: 0"><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding-top: 6px">
            <sc-for list="{{disOpts}}" as="o" hint-placeholder-count="3">
              <button type="button" aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="position: relative; min-height: 44px; text-align: left; padding: 14px 14px 12px; background: {{o.bg}}; border: 1.5px solid {{o.bd}}; border-radius: 12px; font: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 3px">
                <span style="position: absolute; top: -9px; left: 10px; display: {{o.pickDisp}}; background: var(--accent); color: #FFFFFF; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 5px">하나로 PICK</span>
                <span style="font-size: 18px; font-weight: 700; color: #1E2420">{{o.title}}</span>
                <span style="font-size: 13px; line-height: 1.4; color: #56605A">{{o.desc}}</span>
                <span style="font-size: 12px; line-height: 1.4; color: #7A837D">{{o.note}}</span>
                <span style="margin-top: 6px; font-size: 15px; font-weight: 700; color: {{o.fg}}">{{o.priceText}}</span>
              </button>
            </sc-for>
          </div></div>
        </div>
      </div>
      <div style="min-width: 0; position: sticky; top: 20px; padding: 26px; border: 1px solid #E3E6EB; border-radius: 16px; background: #FFFFFF; box-shadow: 0 8px 24px rgba(20, 50, 35, 0.06); display: flex; flex-direction: column; gap: 16px">
        <span style="font-size: 16px; font-weight: 600; color: #3F4843">{{carrierName}} 예상요금</span>
        <div style="display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap"><span style="font-size: 32px; font-weight: 700; color: var(--accent)">{{totalText}}</span><span style="font-size: 13px; color: #56605A">(부가세 포함)</span></div>
        <div style="height: 1px; background: #E3E6EB"></div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div style="display: flex; justify-content: space-between; gap: 12px; font-size: 15px; font-weight: 600"><span>인터넷 요금</span><span>{{netLine}}</span></div>
          <span style="font-size: 13px; color: #56605A">{{netSub}}</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div style="display: flex; justify-content: space-between; gap: 12px; font-size: 15px; font-weight: 600"><span>TV 요금</span><span>{{tvLine}}</span></div>
          <span style="font-size: 13px; color: #56605A">{{tvSub}}</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 15px; font-weight: 600">요금할인혜택</span>
          <div style="display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: #56605A"><span>{{disSub}}</span><span style="color: #D92D4A; font-weight: 600">{{disLine}}</span></div>
          <div style="display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: #56605A"><span>인터넷 추가할인</span><span style="color: #D92D4A; font-weight: 600">{{promoLine}}</span></div>
        </div>
        <button type="button" onClick="{{goQuote}}" style="height: 56px; background: var(--accent); color: #FFFFFF; border: 0; border-radius: 12px; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer">상담신청</button>
        <span style="font-size: 12px; line-height: 1.5; color: #56605A">요금과 조건은 상담 시 확정됩니다.</span>
      </div>
    </section>

    <section id="quote" style="padding: 28px; border: 2px solid var(--accent); border-radius: 12px; background: #FFFFFF; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h2 style="margin: 0; font-size: 24px; font-weight: 700">견적 요청하기</h2>
        <div style="margin: 6px 0 0; padding: 16px 20px; display: flex; align-items: center; gap: 14px; background: color-mix(in srgb, var(--accent) 7%, white); border: 1px solid color-mix(in srgb, var(--accent) 28%, white); border-radius: 12px"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 28 28" style="flex: none"><circle cx="14" cy="14" r="14" fill="var(--accent)"></circle><path d="M8.5 14.5l3.8 3.8 7.2-7.6" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg><p style="margin: 0; min-width: 0; white-space: nowrap; font-size: clamp(13px, 1.65cqw, 18px); font-weight: 600; line-height: 1.5; letter-spacing: -0.01em; color: #1E2420">고객님이 요청하신 조건에서 <strong style="font-weight: 800; color: var(--accent)">혜택이 가장 우수한 파트너업체 한곳</strong>에서만 연락을 드리고 있습니다.</p></div>
      </div>
      <form style="display: flex; flex-direction: column; gap: 12px">
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
          <label style="min-width: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">이름 (선택)<input type="text" autocomplete="name" placeholder="이름을 입력해주세요 (선택)" style="height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #B9C1BC; border-radius: 10px; font: inherit; font-size: 16px; font-weight: 400; color: #1E2420; background: #FFFFFF; width: 100%; min-width: 0"></label>
          <label style="min-width: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">연락처 (필수)<span style="position: relative; display: block"><input type="tel" inputmode="numeric" autocomplete="tel" maxlength="13" required value="{{phone}}" onInput="{{onPhone}}" placeholder="연락처를 입력해주세요 (필수)" style="height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #B9C1BC; border-radius: 10px; font: inherit; font-size: 16px; font-weight: 400; color: #1E2420; background: #FFFFFF; width: 100%; min-width: 0; border: 2px solid {{phoneBd}}; background: {{phoneBg}}"><span aria-hidden="true" style="position: absolute; top: -10px; right: 10px; display: {{badgeDisp}}; padding: 3px 9px; background: #F29900; color: #FFFFFF; border-radius: 6px; font-size: 12px; font-weight: 700; line-height: 1.3">필수입력</span></span></label>
        </div>
        <label style="min-width: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">상담내용 (선택)<textarea rows="3" placeholder="상담받고 싶은 내용을 남겨주세요(선택)" style="height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #B9C1BC; border-radius: 10px; font: inherit; font-size: 16px; font-weight: 400; color: #1E2420; background: #FFFFFF; width: 100%; min-width: 0; height: auto; padding: 12px; resize: vertical; line-height: 1.5"></textarea></label>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
          <label style="min-height: 44px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500"><input type="checkbox" checked required style="flex: none; width: 20px; height: 20px; margin: 0; accent-color: var(--accent)">[필수] 개인정보 수집·이용 동의</label>
          <a href="Privacy.html" style="flex: none; padding: 12px 0; font-size: 13px; color: #56605A">내용 보기</a>
        </div>
        <button type="button" style="height: 56px; background: var(--accent); color: #FFFFFF; border: 0; border-radius: 10px; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer">견적신청</button>
      </form>
    </section>



    <section style="display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; align-items: center; gap: 12px">
          <h2 style="margin: 0; flex: none; font-size: 18px; font-weight: 600; color: #4A524D">직접 고르기</h2>
          <hr style="flex: 1; margin: 0; border: 0; border-top: 1px solid #D5DAD7">
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(180px, 100%), 1fr)); gap: 16px">
          <sc-for list="{{partners}}" as="p" hint-placeholder-count="5">
            <a href="{{p.url}}" target="_blank" rel="noopener" style="min-width: 0; background: #FFFFFF; border-radius: 18px; padding: 8px; box-shadow: {{p.ring}}0 1px 2px rgba(20,30,25,.05), 0 6px 20px rgba(20,30,25,.07); display: flex; flex-direction: column; text-decoration: none; color: inherit; cursor: pointer">
              <div style="position: relative">
                <div role="img" aria-label="{{p.name}} 배너" style="aspect-ratio: 1 / 1; border-radius: 12px; background: #EEF1EF {{p.bg}}; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #6B736E">{{p.bannerLabel}}</div>
              </div>
              <div style="padding: 14px 8px 6px; display: flex; flex-direction: column; gap: 6px; flex: 1">
                <span style="font-size: 11px; font-weight: 600; letter-spacing: .04em; color: #98A09B">광고</span>
                <strong style="font-size: 15px; font-weight: 700; line-height: 1.4; letter-spacing: -0.02em; color: #1E2420">{{p.title}}</strong>
                <span style="font-size: 13px; line-height: 1.5; color: #7A827D; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{p.desc}}</span>
                <span style="margin-top: auto; padding-top: 8px"><span style="height: 40px; display: flex; align-items: center; justify-content: center; background: #F2F5F3; border-radius: 10px; font-size: 14px; font-weight: 700; color: #1E2420">자세히 보기</span></span>
              </div>
            </a>
          </sc-for>
        </div>
      </section>

  </main>

  <footer style="margin-top: auto; padding: 40px max(20px, calc((100vw - 1100px) / 2)); background: #FFFFFF; border-top: 1px solid #DDE1DE; display: flex; flex-direction: column; gap: 6px; font-size: 12px; line-height: 1.6; color: #5F6763">
